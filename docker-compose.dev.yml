services:
  backend:
    container_name: dbo-studio-dev-api
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/back/
    environment:
      APP_PORT: "8080"
      APP_ENV: "docker"
      # Public URL when accessed outside localhost — see docker-compose.dev.env.example
      # APP_PUBLIC_URL: "https://dbo.example.com"
    ports:
      - "8080:8080"
    depends_on:
      - sample-pgsql
      - sample-mysql

  frontend:
    container_name: dbo-studio-dev-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/index.html
      - ./frontend/package.json:/package.json
    environment:
      VITE_PUBLIC_SERVER_URL: "http://localhost:8080/api"
      NODE_ENV: "development"
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - sample-pgsql
      - sample-mysql

  sample-pgsql:
    container_name: dbo-studio-sample-pgsql
    image: postgres:16.1
    ports:
      - "${DB_TEST_PORT-5432}:5432"
    volumes:
      - "./docker/data/pgsql:/var/lib/postgresql/data"
      - "./docs/sample_db/public.sql:/docker-entrypoint-initdb.d/public.sql"
    restart: always
    platform: "linux/amd64"
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: default
      POSTGRES_PASSWORD: secret

  sample-mysql:
    container_name: dbo-studio-sample-mysql
    image: mysql:8.4
    ports:
      - "${MYSQL_TEST_PORT-3307}:3307"
    restart: always
    platform: "linux/amd64"
    environment:
      MYSQL_DATABASE: default
      MYSQL_USER: default
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret

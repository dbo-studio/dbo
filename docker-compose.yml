services:
  dbo:
    container_name: dbo-studio
    image: ghcr.io/dbo-studio/dbo/dbo:latest
    environment:
      APP_PORT: "9000"
      APP_ENV: "docker"
      # Public URL when deployed on a server — see docs/deployment/configuration.md
      # APP_PUBLIC_URL: "https://dbo.example.com"
    volumes:
      - ./docker/dbo:/backend/data
    ports:
      - "9000:9000"
